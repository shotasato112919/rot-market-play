<title>腐相場 / ROT MARKET</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="獲れるものは安い。高いものは、もう獲れない。">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                background: #000; overflow: hidden;
                overscroll-behavior: none; touch-action: none;
                -webkit-text-size-adjust: 100%; }

  /* pyxel.css は canvas を width/height 100% で伸ばし、タッチ端末では高さだけ
     80% にする。縦横比が壊れ、端末のピクセル比と食い違うと左右が切れる。
     **箱をゲームと同じ縦横比に固定して中央に置く。** */
  div#pyxel-screen { position: fixed !important; inset: 0 !important;
                      width: 100% !important; height: 100% !important;
                      display: grid; place-items: center; background: #000; }

  canvas#canvas {
    position: relative !important;
    left: auto !important; top: auto !important;
    width: min(100vw, calc(100vh * 528 / 322)) !important;
    height: min(100vh, calc(100vw * 322 / 528)) !important;
    image-rendering: pixelated;
    touch-action: none;
  }

  /* 縦持ちのときは仮想パッドの分だけ上に寄せ、下を空ける */
  @media (orientation: portrait) and (pointer: coarse) {
    div#pyxel-screen { place-items: start center; }
    canvas#canvas { margin-top: 6vh; }
  }

  /* 横にしてほしい、という案内。横持ちとマウス環境では出さない */
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: block; position: fixed; left: 0; right: 0; bottom: 4vh;
               text-align: center; color: #a9c1ff; background: rgba(0,0,0,.6);
               font: 600 15px/1.6 system-ui, sans-serif; padding: 10px;
               pointer-events: none; z-index: 9; }
  }
</style>
